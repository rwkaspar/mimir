<?xml version="1.0" encoding="UTF-8"?>
<!-- mimir brand mark: an arched window — "a window to life". The photos behind
     it are the life; the frame is the window. Minimal, monochrome,
     light-on-transparent for the black splash. Edit + re-render via
     install_bootsplash.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400">
  <g fill="none" stroke="#ededf0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- arched window outline -->
    <path d="M194 100 a66 66 0 0 1 132 0 V176 a8 8 0 0 1 -8 8 H202 a8 8 0 0 1 -8 -8 Z"/>
    <!-- muntins (panes) -->
    <line x1="260" y1="40" x2="260" y2="184"/>
    <line x1="198" y1="120" x2="322" y2="120"/>
  </g>
  <!-- wordmark -->
  <text x="260" y="352" text-anchor="middle"
        font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="500" letter-spacing="8" fill="#ededf0">mimir</text>
</svg>
