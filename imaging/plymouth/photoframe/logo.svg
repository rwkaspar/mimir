<?xml version="1.0" encoding="UTF-8"?>
<!-- mimir brand mark: a rectangular window — "a window to life". Its landscape
     proportions echo the frame's display (and rotate to a portrait window in
     vertical mode). Minimal, monochrome, light-on-transparent for the black
     splash. Edit + re-render via install_bootsplash.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390">
  <g fill="none" stroke="#ededf0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- window frame -->
    <rect x="155" y="48" width="210" height="133" rx="16"/>
    <!-- muntins (panes) -->
    <line x1="260" y1="54" x2="260" y2="175"/>
    <line x1="161" y1="114" x2="359" y2="114"/>
  </g>
  <!-- wordmark -->
  <text x="260" y="330" text-anchor="middle"
        font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="500" letter-spacing="8" fill="#ededf0">mimir</text>
</svg>
