<?xml version="1.0" encoding="UTF-8"?>
<!-- mimir brand mark: a lens / aperture that also reads as a wise eye (iris +
     pupil). Minimal, monochrome, light-on-transparent for the black splash.
     Edit + re-render via install_bootsplash.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360">
  <g fill="none" stroke="#ededf0" stroke-linecap="round">
    <!-- lens rim -->
    <circle cx="260" cy="116" r="64" stroke-width="11"/>
    <!-- iris -->
    <circle cx="260" cy="116" r="34" stroke-width="9"/>
  </g>
  <!-- pupil -->
  <circle cx="260" cy="116" r="12" fill="#ededf0"/>
  <!-- wordmark -->
  <text x="260" y="300" text-anchor="middle"
        font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="500" letter-spacing="8" fill="#ededf0">mimir</text>
</svg>
