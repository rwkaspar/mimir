<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mimir</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111; color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px; padding-bottom: 40px;
        }
        header { position: sticky; top: 0; z-index: 5; background: #111; padding: 4px 0 12px; }
        .top { display: flex; align-items: center; gap: 12px; }
        .back { color: #8ab4f8; font-size: 16px; text-decoration: none; padding: 8px 0; }
        h1 { font-size: 20px; color: #fff; flex: 1; }
        .count { color: #888; font-size: 14px; margin-top: 4px; }
        .bar { display: flex; gap: 8px; margin-top: 10px; }
        .bar button {
            background: #2a2a2a; border: 1px solid #444; color: #eee;
            border-radius: 8px; padding: 9px 12px; font-size: 14px;
        }
        .bar button.on { background: #36a; border-color: #36a; }
        .hint { color: #777; font-size: 13px; line-height: 1.4; margin: 6px 0 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
        .cell {
            position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
            background: #1c1c1c; border: 0; padding: 0; display: block; width: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        .cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .15s; }
        .cell.off img { opacity: .28; filter: grayscale(1); }
        .box {
            position: absolute; top: 6px; right: 6px; width: 26px; height: 26px;
            border-radius: 7px; border: 2px solid #fff; background: rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; line-height: 1; color: #fff;
        }
        .cell:not(.off) .box { background: #2e7d32; border-color: #2e7d32; }
        .cell:not(.off) .box::after { content: '\2713'; }
        .tag {
            position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600;
            padding: 2px 6px; border-radius: 6px; background: #e8a400; color: #111;
        }
        .tag.vid { background: rgba(0,0,0,.6); color: #fff; left: auto; right: 6px; }
        .empty { color: #888; padding: 40px 0; text-align: center; line-height: 1.5; }
        #msg { color: #f88; font-size: 14px; min-height: 18px; margin-top: 6px; }
    </style>
</head>
<body>
    <header>
        <div class="top">
            <a class="back" id="back" href="/remote">&#8249; <span data-t="back"></span></a>
            <h1 data-t="title"></h1>
        </div>
        <div class="count" id="count"></div>
        <div class="bar">
            <button id="f-all" class="on" onclick="setFilter('all')" data-t="f_all"></button>
            <button id="f-off" onclick="setFilter('off')" data-t="f_off"></button>
            <button onclick="allOn()" data-t="all_on" style="margin-left:auto"></button>
        </div>
        <div id="msg"></div>
    </header>
    <div class="hint" data-t="hint"></div>
    <div class="grid" id="grid"></div>
    <div class="empty is-hidden" id="empty" style="display:none"></div>

    <script>
        var token = null;
        try {
            var m = location.search.match(/[?&]token=([^&]+)/);
            if (m) { token = decodeURIComponent(m[1]); localStorage.setItem('pf_token', token); }
            else { token = localStorage.getItem('pf_token'); }
        } catch (e) {}
        if (token) {
            // Thumbnails are plain <img> requests: they carry the token as a cookie.
            document.cookie = 'pf_token=' + encodeURIComponent(token) + '; path=/; SameSite=Lax';
            document.getElementById('back').href = '/remote?token=' + encodeURIComponent(token);
        }
        function api(url, body) {
            var init = { headers: {} };
            if (token) init.headers['X-Frame-Token'] = token;
            if (body) {
                init.method = 'POST';
                init.headers['Content-Type'] = 'application/json';
                init.body = JSON.stringify(body);
            }
            return fetch(url, init).then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            });
        }

        var i18n = {
            en: {
                title: 'Pictures', back: 'Settings', f_all: 'All', f_off: 'Taken out', all_on: 'Tick all',
                hint: 'Tap a picture to take it out of the slideshow or put it back. New pictures come first.',
                count: '{s} of {n} in the slideshow', new_tag: 'New', video: 'Video',
                empty: 'No pictures on the frame yet. Add a photo source in the settings.',
                empty_off: 'Nothing taken out. Every picture is in the slideshow.',
                none_left: 'Nothing is ticked, so the frame shows all pictures.',
                failed: 'Could not save. Is the frame reachable?'
            },
            de: {
                title: 'Bilder', back: 'Einstellungen', f_all: 'Alle', f_off: 'Herausgenommen', all_on: 'Alle anhaken',
                hint: 'Tippe ein Bild an, um es aus der Diashow zu nehmen oder wieder aufzunehmen. Neue Bilder stehen vorn.',
                count: '{s} von {n} in der Diashow', new_tag: 'Neu', video: 'Video',
                empty: 'Noch keine Bilder auf dem Rahmen. Lege in den Einstellungen eine Fotoquelle an.',
                empty_off: 'Nichts herausgenommen. Alle Bilder sind in der Diashow.',
                none_left: 'Kein Bild ist angehakt, deshalb zeigt der Rahmen alle Bilder.',
                failed: 'Speichern fehlgeschlagen. Ist der Rahmen erreichbar?'
            }
        };
        var lang = null;
        try { lang = localStorage.getItem('frame-language'); } catch (e) {}
        lang = lang || (/^de/i.test(navigator.language || 'de') ? 'de' : 'en');
        function t(k) { return (i18n[lang] || i18n.en)[k] || k; }
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-t]').forEach(function (el) {
            el.textContent = t(el.getAttribute('data-t'));
        });
        document.title = 'mimir – ' + t('title');

        var items = [], orientation = 'horizontal', filter = 'all';

        function showCount() {
            var shown = items.filter(function (i) { return !i.hidden; }).length;
            document.getElementById('count').textContent =
                t('count').replace('{s}', shown).replace('{n}', items.length);
            document.getElementById('msg').style.color = '#e8a400';
            document.getElementById('msg').textContent =
                (items.length && !shown) ? t('none_left') : '';
        }

        function render() {
            var grid = document.getElementById('grid');
            grid.textContent = '';
            var list = items.filter(function (i) { return filter === 'all' || i.hidden; });
            list.forEach(function (it) {
                var b = document.createElement('button');
                b.className = 'cell' + (it.hidden ? ' off' : '');
                b.setAttribute('role', 'checkbox');
                b.setAttribute('aria-checked', it.hidden ? 'false' : 'true');
                b.setAttribute('aria-label', it.name);
                var img = document.createElement('img');
                img.loading = 'lazy';
                img.alt = '';
                img.src = '/api/library/thumb/' + orientation + '/' + encodeURIComponent(it.name);
                b.appendChild(img);
                var box = document.createElement('span');
                box.className = 'box';
                b.appendChild(box);
                if (it.video) {
                    var v = document.createElement('span');
                    v.className = 'tag vid'; v.textContent = t('video');
                    b.appendChild(v);
                }
                if (it['new']) {
                    var n = document.createElement('span');
                    n.className = 'tag'; n.textContent = t('new_tag');
                    b.appendChild(n);
                }
                b.onclick = function () { toggle(it, b); };
                grid.appendChild(b);
            });
            var empty = document.getElementById('empty');
            empty.style.display = list.length ? 'none' : 'block';
            empty.textContent = items.length ? t('empty_off') : t('empty');
            showCount();
        }

        function toggle(it, el) {
            var want = !it.hidden;
            it.hidden = want;
            el.classList.toggle('off', want);
            el.setAttribute('aria-checked', want ? 'false' : 'true');
            showCount();
            api('/api/library', { names: [it.name], hidden: want }).catch(function () {
                it.hidden = !want;                 // could not save: put it back
                el.classList.toggle('off', !want);
                el.setAttribute('aria-checked', !want ? 'false' : 'true');
                showCount();
                var msg = document.getElementById('msg');
                msg.style.color = '#f88';
                msg.textContent = t('failed');
            });
        }

        function setFilter(f) {
            filter = f;
            document.getElementById('f-all').classList.toggle('on', f === 'all');
            document.getElementById('f-off').classList.toggle('on', f === 'off');
            render();
        }

        function allOn() {
            var names = items.filter(function (i) { return i.hidden; })
                             .map(function (i) { return i.name; });
            if (!names.length) return;
            api('/api/library', { names: names, hidden: false }).then(load).catch(function () {
                var msg = document.getElementById('msg');
                msg.style.color = '#f88';
                msg.textContent = t('failed');
            });
        }

        function load() {
            return api('/api/library').then(function (d) {
                items = d.items || [];
                orientation = d.orientation || 'horizontal';
                render();
            }).catch(function () {
                document.getElementById('msg').textContent = t('failed');
            });
        }
        load();
    </script>
</body>
</html>
